<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>VoltTrack - Smart Bill Estimator</title><style> :root { --primary: #4f46e5; --primary-hover: #4338ca; --bg-gradient: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%); --card-bg: #ffffff; --text-main: #1f2937; --text-muted: #6b7280; --border: #e5e7eb; --accent-green: #10b981; --accent-green-bg: #ecfdf5; --danger: #ef4444; } * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; } body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px; } .mobile-container { width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 28px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08); overflow: hidden; display: flex; flex-direction: column; border: 1px solid rgba(255, 255, 255, 0.8); } .app-header { background: var(--primary); color: white; padding: 24px 20px 20px; text-align: left; position: relative; } .app-header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; } .app-header p { font-size: 13px; opacity: 0.85; margin-top: 4px; } .app-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; } .card-panel { background: #f9fafb; border: 1px solid var(--border); border-radius: 16px; padding: 16px; } .card-panel h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 12px; } .input-group { margin-bottom: 12px; } .input-group:last-child { margin-bottom: 0; } label { display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; } input { width: 100%; padding: 12px 14px; background: #ffffff; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; color: var(--text-main); outline: none; transition: border-color 0.2s; } input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); } .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; } .btn:active { transform: scale(0.98); } .btn:hover { background: var(--primary-hover); } .btn-danger-subtle { background: transparent; color: var(--danger); border: 1px solid #fee2e2; margin-top: 10px; } .btn-danger-subtle:hover { background: #fef2f2; } .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; } .metric-card { background: white; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); } .metric-card span { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; } .metric-card strong { font-size: 16px; color: var(--text-main); margin-top: 2px; } .result-box { background: var(--accent-green-bg); border: 1px solid #a7f3d0; border-radius: 12px; padding: 14px; color: #065f46; font-size: 14px; line-height: 1.5; } .result-box strong { color: #047857; } .history-section { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 4px; } .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; margin-top: 8px; } .history-item { background: white; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 13px; } .history-info span { display: block; color: var(--text-muted); font-size: 11px; } .history-badge { background: #e0e7ff; color: var(--primary); padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 12px; } .empty-state { text-align: center; color: var(--text-muted); font-size: 13px; padding: 12px; } </style></head><body><div class="mobile-container"><div class="app-header"><h1>⚡ VoltTrack</h1><p>Smart Bill & Consumption Forecaster</p></div><div class="app-body"><div class="card-panel"><h3>New Monthly Entry</h3><div class="input-group"><label for="billDate">Last Bill Date</label><input type="date" id="billDate"></div><div class="input-group" style="margin-top: 12px;"><label for="lastUnits">Meter Reading Units</label><input type="number" id="lastUnits" placeholder="e.g., 2450"></div><div style="margin-top: 16px;"><button class="btn" onclick="saveMonthlyBill()">Save Bill Baseline</button></div></div><div id="summarySection" class="card-panel" style="display: none;"><h3>Active Cycle Analysis</h3><div class="metrics-grid"><div class="metric-card"><span>Days Elapsed</span><strong id="daysElapsed">0 Days</strong></div><div class="metric-card"><span>Unused Days</span><strong id="unusedDays">30 Days</strong></div></div><div class="input-group" style="margin-top: 12px;"><label for="currentUnits">Current Meter Reading</label><input type="number" id="currentUnits" placeholder="Enter current meter count"></div><div class="input-group" style="margin-top: 12px;"><label for="targetUnits">Target Monthly Quota (Optional)</label><input type="number" id="targetUnits" placeholder="e.g., 200"></div><div style="margin-top: 12px;"><button class="btn" onclick="calculateCurrentEstimation()">Calculate Metrics</button></div><div id="resultSection" class="result-box" style="display: none; margin-top: 12px;"></div></div><div class="history-section"><h3>Saved History</h3><div id="historyListContainer" class="history-list"><div class="empty-state">No saved entries yet.</div></div><button class="btn btn-danger-subtle" onclick="clearHistory()">Clear History</button></div></div></div><script> document.addEventListener('contextmenu', e => e.preventDefault()); document.addEventListener('keydown', function(e) { if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; } if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) { e.preventDefault(); return false; } if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.keyCode === 73)) { e.preventDefault(); return false; } if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'j' || e.key === 'J' || e.keyCode === 74)) { e.preventDefault(); return false; } if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.key === 'C' || e.keyCode === 67)) { e.preventDefault(); return false; } if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) { e.preventDefault(); return false; } }); (function antiDebug() { setInterval(function() { const start = Date.now(); (function() {}["constructor"]("debugger")()); if (Date.now() - start > 100) { document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:20%;">Developer Tools are restricted. Please close the console and reload.</h2>'; } }, 1000); })(); let monthlyBills = []; window.onload = function() { const savedData = localStorage.getItem('voltTrackBills'); if (savedData) { monthlyBills = JSON.parse(savedData); renderHistory(); loadActiveCycle(); } }; function saveMonthlyBill() { const billDateVal = document.getElementById('billDate').value; const lastUnitsVal = parseFloat(document.getElementById('lastUnits').value); if (!billDateVal || isNaN(lastUnitsVal)) { alert('Please fill in both fields correctly.'); return; } const newBill = { billDate: billDateVal, units: lastUnitsVal }; monthlyBills.push(newBill); monthlyBills.sort((a, b) => new Date(b.billDate) - new Date(a.billDate)); localStorage.setItem('voltTrackBills', JSON.stringify(monthlyBills)); renderHistory(); loadActiveCycle(); document.getElementById('currentUnits').value = ''; document.getElementById('targetUnits').value = ''; document.getElementById('resultSection').style.display = 'none'; alert('Baseline saved successfully!'); } function loadActiveCycle() { if (monthlyBills.length === 0) { document.getElementById('summarySection').style.display = 'none'; return; } const latestBill = monthlyBills[0]; const billDate = new Date(latestBill.billDate); const today = new Date(); billDate.setHours(0,0,0,0); today.setHours(0,0,0,0); const diffTime = today - billDate; const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)); const elapsed = diffDays > 0 ? diffDays : 1; const unusedDaysCount = Math.max(0, 30 - elapsed); document.getElementById('daysElapsed').innerText = elapsed + ' Days'; document.getElementById('unusedDays').innerText = unusedDaysCount + ' Days'; document.getElementById('summarySection').style.display = 'block'; } function calculateCurrentEstimation() { if (monthlyBills.length === 0) return; const latestBill = monthlyBills[0]; const currentUnits = parseFloat(document.getElementById('currentUnits').value); const targetUnits = parseFloat(document.getElementById('targetUnits').value); const daysText = document.getElementById('daysElapsed').innerText; const daysElapsed = parseInt(daysText) || 1; const remainingDays = Math.max(0, 30 - daysElapsed); if (isNaN(currentUnits)) { alert('Please enter your current meter reading.'); return; } if (currentUnits < latestBill.units) { alert('Current reading cannot be lower than the baseline reading.'); return; } const consumedSoFar = currentUnits - latestBill.units; const dailyAvg = consumedSoFar / daysElapsed; const estimated30 = Math.round(dailyAvg * 30); let targetAnalysisHtml = ''; if (!isNaN(targetUnits) && targetUnits > 0) { const currentUnusedUnits = targetUnits - consumedSoFar; if (remainingDays > 0) { const safeDailyLimit = (currentUnusedUnits / remainingDays).toFixed(1); if (currentUnusedUnits >= 0) { targetAnalysisHtml = ` <br><strong>Unused Days Left:</strong> ${remainingDays} days <br><strong>Unused Units Left:</strong> ${currentUnusedUnits} units <br><strong>Allowed Daily Pace:</strong> ${safeDailyLimit} u/day `; } else { targetAnalysisHtml = ` <br><strong>Unused Days Left:</strong> ${remainingDays} days <br><strong style="color: #dc2626;">Target Exceeded By:</strong> ${Math.abs(currentUnusedUnits)} units `; } } else { if (currentUnusedUnits >= 0) { targetAnalysisHtml = `<br><strong>Cycle Complete:</strong> Saved ${currentUnusedUnits} unused units`; } else { targetAnalysisHtml = `<br><strong style="color: #dc2626;">Cycle Complete:</strong> Exceeded by ${Math.abs(currentUnusedUnits)} units`; } } } else { targetAnalysisHtml = `<br><strong>Unused Days Left:</strong> ${remainingDays} days`; } const resultDiv = document.getElementById('resultSection'); resultDiv.style.display = 'block'; resultDiv.innerHTML = ` <strong>Consumed:</strong> ${consumedSoFar} units (${dailyAvg.toFixed(1)} u/day)<br><strong>30-Day Est:</strong> ${estimated30} units${targetAnalysisHtml} `; } function renderHistory() { const container = document.getElementById('historyListContainer'); container.innerHTML = ''; if (monthlyBills.length === 0) { container.innerHTML = '<div class="empty-state">No saved entries yet.</div>'; return; } monthlyBills.forEach(bill => { const item = document.createElement('div'); item.className = 'history-item'; item.innerHTML = ` <div class="history-info"><span>Baseline Date</span><strong>${bill.billDate}</strong></div><div class="history-badge">${bill.units} Units</div> `; container.appendChild(item); }); } function clearHistory() { if (confirm('Are you sure you want to delete all saved entries?')) { monthlyBills = []; localStorage.removeItem('voltTrackBills'); renderHistory(); document.getElementById('summarySection').style.display = 'none'; } }</script></body></html>
